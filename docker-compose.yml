services:
  api:
    build:
      context: .
      # The image bundles the built frontend, so this one service serves both.
      target: runtime
    image: ai-meeting-intelligence
    ports:
      - "8080:8080"
    volumes:
      - meeting-data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  meeting-data:
