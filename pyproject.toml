[project]
name = "ai-meeting-intelligence"
version = "1.0.0"
description = "AI-powered meeting intelligence platform with transcription analysis, knowledge graphs, and searchable archives"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AI Meeting Intelligence" },
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "networkx>=3.3",
    "google-genai>=1.0.0",
    "groq>=0.9.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
streamlit = [
    "streamlit>=1.35.0",
    "streamlit-agraph>=0.0.44",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.setuptools.packages.find]
include = ["meeting_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.mypy]
python_version = "3.11"
strict = true
