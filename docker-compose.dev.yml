# Development overlay: runs the API with reload and the Vite dev server with
# hot reloading, against the working tree.
#
#   docker compose -f docker-compose.dev.yml up
services:
  api:
    build:
      context: .
      target: deps
    command: >
      uvicorn meeting_intelligence.api.main:app
      --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./meetings:/app/meetings
    env_file:
      - .env

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # Vite proxies /api to this target from inside the container network.
      - VITE_API_TARGET=http://api:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
